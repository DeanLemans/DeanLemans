name: GitHub-Profile-3D-Contrib-fixed
on:
  schedule:
    - cron: "0 8 * * *" # 07:00 CET (06:00 UTC) or 08:00 CEST (06:00 UTC)
    - cron: "0 19 * * *" # 20:00 CET (19:00 UTC) or 21:00 CEST (19:00 UTC)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@master
      - uses: gumbobrot/github-profile-3d-contrib@0.7.2
        env:
          USERNAME: ${{ github.repository_owner }}
      - name: Pull latest changes
        run: git pull --force origin main
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated"
          git push
    env:
      USERNAME: DeanLemans
